# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch: null
env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 1

    - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      name: Install pnpm
      with:
        install: false

    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile

    # wsam のビルドを先に実施しないと import 解決できずに lint でエラーになるため
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Install wasm-pack
      # cargo install は上流の依存(yanked 済みの zip)が原因でコンパイル失敗するため、
      # GitHub Releases のプリビルドバイナリを直接取得する(npm グローバルの
      # PATH 解決に依存しないため確実)。sha256 は v0.15.0 の公開値。
      run: |
        set -eu
        VERSION=0.15.0
        SHA256=c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        curl -sSfL -o /tmp/wasm-pack.tar.gz "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${VERSION}/wasm-pack-v${VERSION}-x86_64-unknown-linux-musl.tar.gz"
        echo "${SHA256}  /tmp/wasm-pack.tar.gz" | sha256sum -c -
        mkdir -p /tmp/wasm-pack-extract "$HOME/.cargo/bin"
        tar -xzf /tmp/wasm-pack.tar.gz -C /tmp/wasm-pack-extract
        install -m 755 "$(find /tmp/wasm-pack-extract -name wasm-pack -type f | head -n 1)" "$HOME/.cargo/bin/wasm-pack"
        wasm-pack --version

    - name: build
      # 並列ビルドだと OOM で SIGKILL されるため並列数を絞る
      run: pnpm -r --workspace-concurrency=2 --if-present build

    - name: lint
      run: pnpm lint

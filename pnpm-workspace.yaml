packages:
  - cloudwatch-rum/pages
  - cloudwatch-rum/infra
  - cloudwatch-rum/infra/function
  - github-auth-ssg/frontend
  - github-auth-ssg/frontend/cdk
  - github-auth-ssg/backend
  - graphql-msw/frontend/cdk
  - graphql-msw/frontend
  - graphql-msw/backend
  - kuma-ui-example
  - next-amplified
  - next-gsap-example
  - next-i18n/app
  - next-i18n/infra
  - next-i18n/infra/function
  - next-ts-oxc-example
  - next-ts-biome-example
  - next-zustand-example
  - nextjs-dynamic-routing-app/app
  - sticky-example
  - wasm
  - wasm/app
  - wasm/infra

allowBuilds:
  '@apollo/protobufjs': false
  core-js-pure: false
  esbuild: false
  msw: false
  sharp: false
  unrs-resolver: false

blockExoticSubdeps: true

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.24.0
  - '@pnpm/exe.android-arm64@12.24.0'
  - '@pnpm/exe.android-x64@12.24.0'
  - '@pnpm/exe.darwin-arm64@12.24.0'
  - '@pnpm/exe.darwin-x64@12.24.0'
  - '@pnpm/exe.freebsd-x64@12.24.0'
  - '@pnpm/exe.linux-arm64-musl@12.24.0'
  - '@pnpm/exe.linux-arm64@12.24.0'
  - '@pnpm/exe.linux-loong64@12.24.0'
  - '@pnpm/exe.linux-ppc64@12.24.0'
  - '@pnpm/exe.linux-riscv64@12.24.0'
  - '@pnpm/exe.linux-s390x@12.24.0'
  - '@pnpm/exe.linux-x64-musl@12.24.0'
  - '@pnpm/exe.linux-x64@12.24.0'
  - '@pnpm/exe.netbsd-x64@12.24.0'
  - '@pnpm/exe.win32-arm64@12.24.0'
  - '@pnpm/exe.win32-x64@12.24.0'

overrides:
  '@graphql-tools/utils@<=12.0.0': ^12.0.1
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
  browserslist@<=4.28.6: ^4.28.7
  chokidar: '>=5'
  esbuild@<=0.24.2: ^0.25.0
  follow-redirects@>=1.16.0 <=1.16.1: ^1.16.2
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  immutable@<3.8.4: ^3.8.4
  lodash@<=4.17.23: ^4.18.1
  minimatch@<11.0.1: ^11.0.1
  semver: '>=7'
  tinypool@<2.1.2: ^2.1.2
  ua-parser-js: '>=2'
  uuid@<11.1.1: ^14

trustPolicy: no-downgrade

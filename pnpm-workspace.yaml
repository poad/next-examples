packages:
  - cloudwatch-rum/pages
  - cloudwatch-rum/infra
  - cloudwatch-rum/infra/function
  - github-auth-ssg/frontend
  - github-auth-ssg/frontend/cdk
  - github-auth-ssg/backend
  - graphql-msw/frontend/cdk
  - graphql-msw/frontend
  - graphql-msw/backend
  - kuma-ui-example
  - next-amplified
  - next-gsap-example
  - next-i18n/app
  - next-i18n/infra
  - next-i18n/infra/function
  - next-ts-oxc-example
  - next-ts-biome-example
  - next-zustand-example
  - nextjs-dynamic-routing-app/app
  - sticky-example
  - wasm
  - wasm/app
  - wasm/infra

allowBuilds:
  '@apollo/protobufjs': false
  core-js-pure: false
  esbuild: false
  msw: false
  sharp: false
  unrs-resolver: false

blockExoticSubdeps: true

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.12.0
  - '@pnpm/exe.android-arm64@12.12.0'
  - '@pnpm/exe.android-x64@12.12.0'
  - '@pnpm/exe.darwin-arm64@12.12.0'
  - '@pnpm/exe.darwin-x64@12.12.0'
  - '@pnpm/exe.freebsd-x64@12.12.0'
  - '@pnpm/exe.linux-arm64-musl@12.12.0'
  - '@pnpm/exe.linux-arm64@12.12.0'
  - '@pnpm/exe.linux-ppc64@12.12.0'
  - '@pnpm/exe.linux-riscv64@12.12.0'
  - '@pnpm/exe.linux-s390x@12.12.0'
  - '@pnpm/exe.linux-x64-musl@12.12.0'
  - '@pnpm/exe.linux-x64@12.12.0'
  - '@pnpm/exe.win32-arm64@12.12.0'
  - '@pnpm/exe.win32-x64@12.12.0'

  - '@next/bundle-analyzer@16.4.0'
  - '@next/env@16.4.0'
  - '@next/swc-darwin-arm64@16.4.0'
  - '@next/swc-darwin-x64@16.4.0'
  - '@next/swc-linux-arm64-gnu@16.4.0'
  - '@next/swc-linux-arm64-musl@16.4.0'
  - '@next/swc-linux-x64-gnu@16.4.0'
  - '@next/swc-linux-x64-musl@16.4.0'
  - '@next/swc-win32-arm64-msvc@16.4.0'
  - '@next/swc-win32-x64-msvc@16.4.0'
  - next@16.4.0

overrides:
  '@graphql-tools/utils@<=12.0.0': ^12.0.1
  browserslist@<=4.28.6: ^4.28.7
  chokidar: '>=5'
  esbuild@<=0.24.2: ^0.25.0
  immutable@<3.8.4: ^3.8.4
  lodash@<=4.17.23: ^4.18.1
  semver: '>=7'
  tinypool@<2.1.2: ^2.1.2
  ua-parser-js: '>=2'
  uuid@<11.1.1: ^14

trustPolicy: no-downgrade
